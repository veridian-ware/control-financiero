ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ com.controlfinanciero.ApplicationKt.module ]
    }
}

app {
    // "development" (default) | "production" | "staging". En cualquier valor distinto
    // de "development" el server hace fail-fast si el JWT_SECRET sigue siendo el default.
    environment = "development"
    environment = ${?APP_ENV}
}

database {
    url = "jdbc:postgresql://localhost:5432/control_financiero"
    url = ${?DATABASE_URL}
    driver = "org.postgresql.Driver"
    user = "postgres"
    user = ${?DATABASE_USER}
    password = "postgres"
    password = ${?DATABASE_PASSWORD}
}

mercadopago {
    accessToken = ${?MERCADOPAGO_ACCESS_TOKEN}
    baseUrl = "https://api.mercadopago.com"
}

jwt {
    secret = "dev-secret-cambiar-en-produccion"
    secret = ${?JWT_SECRET}
    issuer = "control-financiero"
    issuer = ${?JWT_ISSUER}
    audience = "control-financiero-app"
    audience = ${?JWT_AUDIENCE}
    realm = "Control Financiero"
    validityMs = 604800000 // 7 días
    validityMs = ${?JWT_VALIDITY_MS}
}
